<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Log in – NestRoom</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/modern.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <h1 class="brand"><span class="logo-mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/></svg></span>NestRoom</h1>
    <p class="sub">Log in to your account</p>
    <form id="f" data-kind="login" novalidate>
      <div class="seg" role="radiogroup" aria-label="Log in as">
        <input type="radio" name="role" id="r-user" value="user" checked><label for="r-user">User</label>
        <input type="radio" name="role" id="r-owner" value="owner"><label for="r-owner">Owner</label>
        <input type="radio" name="role" id="r-admin" value="admin"><label for="r-admin">Admin</label>
      </div>
      <div class="field"><label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required></div>
      <div class="field"><label for="password">Password</label>
        <div class="pw"><input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="button" data-toggle="password">Show</button></div></div>
      <p class="err" id="err" role="alert"></p>
      <button class="btn full" type="submit">Log in</button>
    </form>
    <p class="note">Owner accounts can log in after the admin approves them.</p>
    <div class="links" id="reglinks">
      <span>New tenant? <a href="register-user.html">Create a user account</a></span>
      <span>Own a PG or room? <a href="register-owner.html">Register as an owner</a></span>
    </div>
  </div>
</div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
